# Hospital details (single source of truth; edit here)
hospital.name=SYAMALA HOMOEO HOSPITAL
hospital.phone-display=+91 79811 01666
hospital.phone-link=+917981101666
hospital.email=[Email to be supplied]
hospital.address=[Address to be supplied]
hospital.opening-hours=[Opening hours to be supplied]
hospital.established-year=1996

# Database (values come from environment variables in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/syamala_hospital}
spring.datasource.username=${DB_USERNAME:syamala_app}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate must never change the schema; Flyway owns it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Appointment rules (PLACEHOLDER hours: replace with the hospital's real hours)
appointment.earliest-time=09:00
appointment.latest-time=17:30
appointment.slot-minutes=30
appointment.max-days-ahead=60
appointment.timezone=Asia/Kolkata


# Session and cookie safety
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Must be true in production (HTTPS). false only so http://localhost works.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# First-admin provisioning (blank by default; never put real values in this file)
admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}


# Public address of the site (canonical links, sitemap.xml, robots.txt).
# Set SITE_BASE_URL to https://your-domain when the domain exists.
site.base-url=${SITE_BASE_URL:http://localhost:8080}

# Never show internal error details to visitors
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Faster loading
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/xml,text/plain
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d