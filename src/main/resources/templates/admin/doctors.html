<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Doctors')}"></head>
<body>
<header th:replace="~{fragments/admin-layout :: adminNav}"></header>
<main id="main" class="container section-pad">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Doctors</h1>
        <a class="btn btn-teal" th:href="@{/admin/doctors/new}">Add doctor</a>
    </div>
    <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>
    <div class="table-responsive">
        <table class="table align-middle">
            <thead><tr><th scope="col">Name</th><th scope="col">Qualification</th>
                <th scope="col">Order</th><th scope="col">Status</th><th scope="col">Action</th></tr></thead>
            <tbody>
            <tr th:each="d : ${doctors}">
                <td th:text="${d.fullName()}">Name</td>
                <td th:text="${d.qualification()}">Qualification</td>
                <td th:text="${d.displayOrder()}">0</td>
                <td><span class="badge" th:text="${d.active()} ? 'Visible' : 'Hidden'"
                          th:classappend="${d.active()} ? 'text-bg-success' : 'text-bg-secondary'">Visible</span></td>
                <td><a class="btn btn-sm btn-outline-teal" th:href="@{/admin/doctors/{id}/edit(id=${d.id()})}"
                       th:attr="aria-label='Edit ' + ${d.fullName()}">Edit</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
