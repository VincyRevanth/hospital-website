<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Reset password')}"></head>
<body>
<header th:replace="~{fragments/admin-layout :: adminNav}"></header>
<main id="main" class="container section-pad maxw-720">
    <h1 class="h3 mb-3">Reset password for <span th:text="${username}">staff1</span></h1>
    <p>The staff member will have to choose a new password at their next sign-in.</p>
    <form th:action="@{/admin/users/{id}/reset(id=${userId})}" th:object="${form}" method="post" novalidate>
        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">
            <ul class="mb-0"><li th:each="err : ${#fields.errors('*')}" th:text="${err}">Error</li></ul>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">New temporary password (12 to 72 characters) *</label>
            <input type="password" id="password" th:field="*{password}" class="form-control"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                   maxlength="72" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-teal">Reset password</button>
        <a class="btn btn-outline-teal ms-2" th:href="@{/admin/users}">Cancel</a>
    </form>
</main>
<th:block th:replace="~{fragments/admin-layout :: adminScripts}"></th:block>
</body>
</html>
