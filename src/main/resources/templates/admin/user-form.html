<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Add staff account')}"></head>
<body>
<header th:replace="~{fragments/admin-layout :: adminNav}"></header>
<main id="main" class="container section-pad maxw-720">
    <h1 class="h3 mb-3">Add staff account</h1>
    <div class="alert alert-info" role="note">
        Choose a long temporary password (a password manager can generate one). Give it to the staff member
        privately, not by a shared chat. They must replace it at first sign-in.
    </div>
    <form th:action="@{/admin/users}" th:object="${form}" method="post" novalidate>
        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">
            <ul class="mb-0"><li th:each="err : ${#fields.errors('*')}" th:text="${err}">Error</li></ul>
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">Username *</label>
            <input type="text" id="username" th:field="*{username}" class="form-control"
                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                   maxlength="50" autocomplete="off" required aria-describedby="userHelp">
            <div id="userHelp" class="form-text">Lowercase letters, digits, dot, underscore or dash.</div>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Temporary password (12 to 72 characters) *</label>
            <input type="password" id="password" th:field="*{password}" class="form-control"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                   maxlength="72" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-teal">Create account</button>
        <a class="btn btn-outline-teal ms-2" th:href="@{/admin/users}">Cancel</a>
    </form>
</main>
<th:block th:replace="~{fragments/admin-layout :: adminScripts}"></th:block>
</body>
</html>
