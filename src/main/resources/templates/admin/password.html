<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Change password')}"></head>
<body>
<header th:replace="~{fragments/admin-layout :: adminNav}"></header>
<main id="main" class="container section-pad maxw-720">
    <h1 class="h3 mb-3">Change password</h1>
    <div th:if="${forced}" class="alert alert-warning" role="alert">
        You are using a temporary password. Please choose your own password to continue.
    </div>
    <form th:action="@{/admin/password}" th:object="${form}" method="post" novalidate>
        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">
            <ul class="mb-0"><li th:each="err : ${#fields.errors('*')}" th:text="${err}">Error</li></ul>
        </div>
        <div class="mb-3">
            <label for="currentPassword" class="form-label">Current password *</label>
            <input type="password" id="currentPassword" th:field="*{currentPassword}" class="form-control"
                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                   autocomplete="current-password" required>
        </div>
        <div class="mb-3">
            <label for="newPassword" class="form-label">New password (12 to 72 characters) *</label>
            <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control"
                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                   maxlength="72" autocomplete="new-password" required>
        </div>
        <div class="mb-4">
            <label for="confirmPassword" class="form-label">Repeat new password *</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                   maxlength="72" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-teal">Change password</button>
    </form>
</main>
<th:block th:replace="~{fragments/admin-layout :: adminScripts}"></th:block>
</body>
</html>
