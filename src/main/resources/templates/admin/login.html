<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Sign in')}"></head>
<body>
<main id="main" class="container section-pad maxw-440">
    <h1 class="h3 mb-4">Admin sign in</h1>

    <div th:if="${param.error}" class="alert alert-danger" role="alert">Invalid username or password.</div>
    <div th:if="${param.locked}" class="alert alert-warning" role="alert">
        Too many failed attempts. Please try again in 15 minutes.</div>
    <div th:if="${param.logout}" class="alert alert-success" role="status">You have been signed out.</div>

    <form th:action="@{/admin/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control"
                   autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control"
                   autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-teal">Sign in</button>
    </form>
</main>
</body>
</html>
