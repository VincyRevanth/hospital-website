<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Services')}"></head>
<body>
<header th:replace="~{fragments/admin-layout :: adminNav}"></header>
<main id="main" class="container section-pad">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Services</h1>
        <a class="btn btn-teal" th:href="@{/admin/services/new}">Add service</a>
    </div>
    <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>
    <p th:if="${services.isEmpty()}">No services yet.</p>
    <div class="table-responsive" th:unless="${services.isEmpty()}">
        <table class="table align-middle">
            <thead><tr><th scope="col">Name</th><th scope="col">Order</th>
                <th scope="col">Status</th><th scope="col">Action</th></tr></thead>
            <tbody>
            <tr th:each="s : ${services}">
                <td th:text="${s.name()}">Name</td>
                <td th:text="${s.displayOrder()}">0</td>
                <td><span class="badge" th:text="${s.active()} ? 'Visible' : 'Hidden'"
                          th:classappend="${s.active()} ? 'text-bg-success' : 'text-bg-secondary'">Visible</span></td>
                <td><a class="btn btn-sm btn-outline-teal" th:href="@{/admin/services/{id}/edit(id=${s.id()})}"
                       th:attr="aria-label='Edit ' + ${s.name()}">Edit</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
