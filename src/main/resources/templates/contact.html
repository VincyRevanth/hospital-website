<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contact Us | ' + ${hospital.name}, 'Contact ' + ${hospital.name} + ' by phone or visit us.')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main">
    <section class="page-header"><div class="container"><h1>Contact Us</h1></div></section>
    <section class="section-pad">
        <div class="container">
            <dl class="row">
                <dt class="col-sm-3">Phone</dt>
                <dd class="col-sm-9"><a th:href="'tel:' + ${hospital.phoneLink}" th:text="${hospital.phoneDisplay}">Phone</a></dd>
                <dt class="col-sm-3">Email</dt>
                <dd class="col-sm-9" th:text="${hospital.email}">Email</dd>
                <dt class="col-sm-3">Address</dt>
                <dd class="col-sm-9" style="white-space: pre-line;" th:text="${hospital.address}">Address</dd>
                <dt class="col-sm-3">Opening hours</dt>
                <dd class="col-sm-9" style="white-space: pre-line;" th:text="${hospital.openingHours}">Hours</dd>
                <dt class="col-sm-3">Directions</dt>
                <dd class="col-sm-9">
                    <a th:if="${hospital.mapUrl != null}" th:href="${hospital.mapUrl}"
                       target="_blank" rel="noopener noreferrer">Open in maps</a>
                    <span class="placeholder-note" th:if="${hospital.mapUrl == null}">[Map link to be added]</span>
                </dd>
            </dl>
            <p>To book, <a th:href="@{/appointments/new}">request an appointment online</a> or call us.</p>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
