<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, description)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Page title</title>
    <meta name="description" th:content="${description}">
    <meta name="robots" content="noindex, nofollow" th:if="${status != null}">
    <link rel="canonical" th:if="${canonicalUrl != null and status == null}" th:href="${canonicalUrl}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" th:content="${hospitalName}">
    <meta property="og:title" th:content="${title}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:url" th:if="${canonicalUrl != null}" th:content="${canonicalUrl}">
    <meta property="og:image" th:if="${baseUrl != null}" th:content="${baseUrl} + '/img/logo.jpeg'">
    <meta property="og:locale" content="en_IN">
    <meta name="twitter:card" content="summary">
    <link rel="icon" th:href="@{/img/logo.jpeg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>

<header th:fragment="header">
    <a class="skip-link" href="#main">Skip to main content</a>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand brand" th:href="@{/}">
                <img th:src="@{/img/logo.jpeg}" alt="" class="brand-logo" width="44" height="44">
                <span th:text="${hospital.name}">HOSPITAL</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navMenu" aria-controls="navMenu"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" th:href="@{/about}"
                        th:attr="aria-current=${currentPath == '/about' ? 'page' : null}">About</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/treatments}"
                        th:attr="aria-current=${currentPath == '/treatments' ? 'page' : null}">Treatments</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/doctors}"
                        th:attr="aria-current=${currentPath == '/doctors' ? 'page' : null}">Doctors</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/faq}"
                        th:attr="aria-current=${currentPath == '/faq' ? 'page' : null}">FAQ</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contact}"
                        th:attr="aria-current=${currentPath == '/contact' ? 'page' : null}">Contact</a></li>
                    <li class="nav-item ms-lg-2"><a class="btn btn-teal" th:href="@{/appointments/new}">Request Appointment</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<footer th:fragment="footer" class="site-footer py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <p class="mb-0">&copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span>
            <span th:text="${hospital.name}">HOSPITAL</span>. All rights reserved.</p>
        <p class="mb-0">
            <a th:href="'tel:' + ${hospital.phoneLink}" th:text="${hospital.phoneDisplay}">Phone</a>
            &nbsp;|&nbsp; <a th:href="@{/faq}">FAQ</a>
            &nbsp;|&nbsp; <a th:href="@{/privacy}">Privacy Policy</a>
        </p>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
