<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="adminHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${title} + ' | Admin'">Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>

<header th:fragment="adminNav">
    <nav class="navbar navbar-expand bg-white border-bottom" aria-label="Admin navigation">
        <div class="container">
            <a class="navbar-brand brand" th:href="@{/admin}">Admin</a>
			<ul class="navbar-nav me-auto flex-wrap">
			    <li class="nav-item"><a class="nav-link" th:href="@{/admin}">Dashboard</a></li>
			    <li class="nav-item"><a class="nav-link" th:href="@{/admin/appointments}">Appointments</a></li>
			    <li class="nav-item"><a class="nav-link" th:href="@{/admin/messages}">Messages</a></li>
			    <li class="nav-item"><a class="nav-link" th:href="@{/admin/doctors}">Doctors</a></li>
			    <li class="nav-item"><a class="nav-link" th:href="@{/admin/services}">Services</a></li>
			    <li class="nav-item"><a class="nav-link" th:href="@{/admin/settings}">Settings</a></li>
			</ul>
            <form th:action="@{/admin/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-teal btn-sm">Sign out</button>
            </form>
        </div>
    </nav>
</header>

</body>
</html>
