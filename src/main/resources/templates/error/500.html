<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong | ' + ${hospital.name}, 'An unexpected error occurred.')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main">
    <section class="section-pad">
        <div class="container text-center" style="max-width: 640px;">
            <h1>Something went wrong</h1>
            <p>We are sorry, an unexpected error occurred. Please try again in a few minutes.
                For urgent matters, please call
                <a th:href="'tel:' + ${hospital.phoneLink}" th:text="${hospital.phoneDisplay}">phone</a>.</p>
            <a class="btn btn-teal" th:href="@{/}">Back to home</a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
